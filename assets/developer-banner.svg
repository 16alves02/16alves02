<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">16alves02 terminal profile</title>
  <desc id="desc">A minimal terminal window showing Leonardo Alves's real profile information and development interests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#17110c"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="390" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="388" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <rect x="0" y="0" width="5" height="390" rx="2" fill="#ff7a18"/>
  <circle cx="32" cy="30" r="5.5" fill="#ff5f57"/>
  <circle cx="52" cy="30" r="5.5" fill="#febc2e"/>
  <circle cx="72" cy="30" r="5.5" fill="#28c840"/>
  <text x="100" y="35" fill="#8a827a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">leonardo@16alves02: ~</text>
  <text x="1160" y="35" fill="#68615b" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">zsh</text>
  <line x1="28" y1="54" x2="1172" y2="54" stroke="#ffffff" stroke-opacity=".10"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="48" y="98" fill="#ff7a18">$ whoami</text>
    <text x="48" y="145" fill="#f4f1ed" font-size="34" font-weight="700">Leonardo Alves</text>
    <text x="48" y="179" fill="#c3bbb3" font-size="17">Software Development Student · Portugal</text>
    <text x="48" y="229" fill="#ff7a18">$ cat focus.txt</text>
    <text x="48" y="264" fill="#d5cec7" font-size="17">web interfaces / mobile apps / APIs / databases / UI</text>
    <text x="48" y="311" fill="#ff7a18">$ git status --short</text>
    <text x="48" y="345" fill="#a9b8a3" font-size="17">learning  building  improving</text>
    <rect x="354" y="329" width="11" height="20" rx="1" fill="#ff7a18">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="825" y1="78" x2="825" y2="354" stroke="#ffffff" stroke-opacity=".10"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="865" y="101" fill="#8a827a">PROFILE</text>
    <text x="865" y="139" fill="#ff7a18">01</text><text x="905" y="139" fill="#d5cec7">web development</text>
    <text x="865" y="177" fill="#ff7a18">02</text><text x="905" y="177" fill="#d5cec7">mobile development</text>
    <text x="865" y="215" fill="#ff7a18">03</text><text x="905" y="215" fill="#d5cec7">REST APIs</text>
    <text x="865" y="253" fill="#ff7a18">04</text><text x="905" y="253" fill="#d5cec7">databases</text>
    <text x="865" y="291" fill="#ff7a18">05</text><text x="905" y="291" fill="#d5cec7">interface design</text>
    <text x="865" y="345" fill="#77706a" font-size="13">16alves02 / main</text>
  </g>
</svg>
name: Update profile README cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate renderer
        run: python -m unittest discover -s tests -v

      - name: Render animated SVG cards
        run: python scripts/render_readme_cards.py

      - name: Commit refreshed cards and contribution cache
        run: |
          if [[ -n "$(git status --porcelain cards/ data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cards/ data/
            git commit -m "chore: refresh profile README cards"
            git push
          else
            echo "Profile cards are already up to date."
          fi
